# Traefik (ports 80/443, Let's Encrypt) terminates HTTPS for drnituporna.com and forwards here via the vet-proxy container.
# Behind Traefik every connection comes from the Docker bridge, so visitors are told apart by X-Forwarded-For.
# Per-visitor limit on sign-in / sign-up / password-reset calls (guessing passwords, spam accounts).
limit_req_zone $http_x_forwarded_for zone=vet_auth:10m rate=10r/m;

server {
  listen 172.17.0.1:8081;
  server_tokens off;
  root /root/vet-online-consultancy/dist;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 1m;

  # Inherited by every location below (none of them uses add_header, which would reset these).
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/auth/ {
    limit_req zone=vet_auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_forwarded_for;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_forwarded_for;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /assets/ { expires 1y; try_files $uri =404; }
  location / { expires -1; try_files $uri /index.html; }
}
