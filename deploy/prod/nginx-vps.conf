# Traefik (ports 80/443, Let's Encrypt) terminates HTTPS for 213-210-37-157.nip.io and forwards here via the vet-proxy container.
server {
  listen 172.17.0.1:8081;
  root /root/vet-online-consultancy/dist;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 20m;
  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_forwarded_for;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
