server {
  listen 8443 ssl;
  ssl_certificate /etc/nginx/ssl/vet.crt;
  ssl_certificate_key /etc/nginx/ssl/vet.key;
  root /root/vet-online-consultancy/dist;
  index index.html;
  client_max_body_size 20m;
  location /api/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; }
  location / { try_files $uri /index.html; }
}
server {
  listen 8080;
  return 301 https://$host:8443$request_uri;
}
