# Nginx site for the vet consultation site: serves the built frontend and proxies /api to the backend.
# Copy to /etc/nginx/sites-available/vet, replace YOUR_DOMAIN, then:
#   sudo ln -s /etc/nginx/sites-available/vet /etc/nginx/sites-enabled/vet
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN     (adds HTTPS and the redirect)
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # The built frontend (npm run build writes it to dist/)
    root /srv/vet/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend API. X-Forwarded-For lets the backend see each visitor's real IP (login rate limits use it).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build files never change, so browsers can cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the React app: unknown paths (/book, /admin, ...) fall back to index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
