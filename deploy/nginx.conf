# Nginx site for the vet consultation site: serves the built frontend and proxies /api to the backend.
# Copy to /etc/nginx/sites-available/vet, replace YOUR_DOMAIN, then:
#   sudo ln -s /etc/nginx/sites-available/vet /etc/nginx/sites-enabled/vet
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN     (adds HTTPS and the redirect)
# Per-visitor limit on sign-in / sign-up / password-reset calls (guessing passwords, spam accounts).
# Must sit outside the server block. 10 requests a minute with a burst of 10 is plenty for a real person.
limit_req_zone $binary_remote_addr zone=vet_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # The built frontend (npm run build writes it to dist/)
    root /srv/vet/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Inherited by every location below (none of them uses add_header, which would reset these).
    # After certbot has HTTPS working, also add: add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API. X-Forwarded-For lets the backend see each visitor's real IP (login rate limits use it).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/auth/ {
        limit_req zone=vet_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build files never change, so browsers can cache them for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else is the React app: unknown paths (/book, /admin, ...) fall back to index.html.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
